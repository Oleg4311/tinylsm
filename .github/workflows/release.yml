name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: сборка (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Версия в Cargo.toml должна совпадать с тегом
        shell: bash
        run: test "v$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys;print(json.load(sys.stdin)['packages'][0]['version'])")" = "$GITHUB_REF_NAME"
      - run: cargo test --release --locked
      - run: cargo build --release --locked --bin tinylsm
      - name: Упаковка
        shell: bash
        run: |
          mkdir out
          cp "target/release/tinylsm${{ matrix.ext }}" "out/tinylsm-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - run: (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Подтверждение происхождения (provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/tinylsm-*
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "tinylsm $GITHUB_REF_NAME"
          --notes "Консольная утилита tinylsm для Linux (x86_64), Windows (x86_64) и macOS (Apple Silicon). Проверьте SHA-256 из SHA256SUMS и аттестацию: gh attestation verify <файл> --repo Oleg4311/tinylsm. Как библиотеку подключайте из git: tinylsm = { git = \"https://github.com/Oleg4311/tinylsm\", tag = \"$GITHUB_REF_NAME\" }. В crates.io пакет пока не публикуется."
